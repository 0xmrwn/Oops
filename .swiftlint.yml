# SwiftLint (version pinned in mise.toml). Default rules minus the ones that fight the house style
# or that SwiftFormat and the token budget already cover, plus opt-in rules that catch real mistakes.
included: [Sources, Tests, Package.swift, fixtures, design]

disabled_rules:
  # House style: long dense lines, short names (x, id), `}` and `else` on separate lines, aligned cases.
  - line_length
  - identifier_name
  - statement_position
  - switch_case_alignment
  - multiple_closures_with_trailing_closure
  - trailing_comma
  # Size and shape: the token budget (script/token-budget) limits file size instead.
  - file_length
  - type_body_length
  - function_body_length
  - function_parameter_count
  - cyclomatic_complexity
  - large_tuple
  - nesting
  # Accessibility and C APIs hand back untyped values; these casts are checked where they're made.
  - force_cast
  - optional_data_string_conversion
  # Oops's observers live as long as the app; `for` loops whose filter throws can't use `where`.
  - discarded_notification_center_observer
  - for_where
  # SwiftFormat owns these.
  - vertical_whitespace
  - implicit_optional_initialization

opt_in_rules:
  - class_delegate_protocol
  - closure_parameter_position
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - duplicate_conditions
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - fatal_error_message
  - final_test_case
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - last_where
  - legacy_multiple
  - lower_acl_than_parent
  - private_swiftui_state
  - reduce_into
  - sorted_first_last
  - toggle_bool
  - unhandled_throwing_task
  - unowned_variable_capture
  - yoda_condition
