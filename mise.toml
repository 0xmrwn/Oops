# Developer tools, pinned. `mise install` (or `just setup`) installs exactly these versions.
# Xcode 27 (Swift 6.4) and Python 3 come from the system.
[tools]
just = "1.59.0"
prek = "0.5.7"
swiftformat = "0.64.1"
swiftlint = "0.65.1"
ruff = "0.17.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
rumdl = "0.3.0"
