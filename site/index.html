</head>
<body>

<div class="first">
<header class="bar">
  <a class="wordmark" href="#" aria-label="Oops"></a>
  <nav class="actions">
    <a class="repo" href="https://github.com/0xmrwn/Oops" aria-label="Oops on GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
    </a>
    <a class="get" href="https://github.com/0xmrwn/Oops/releases/latest/download/Oops.dmg">

    </a>
  </nav>
</header>

<main class="hero">
  <div class="scene" id="field" data-kind="chat">
    <div class="outline" id="outline" aria-hidden="true">
      <span class="send"><svg viewBox="0 0 20 20"><path d="M10 15.5v-11M5.5 9L10 4.5 14.5 9"/></svg></span>
    </div>
    <div class="head" id="head" aria-hidden="true">
      <div class="mail">
        <div class="title">New Message<svg viewBox="0 0 20 20"><path d="M17.5 2.5L9 11M17.5 2.5l-5 15L9 11 2.5 7.5z"/></svg></div>
        <div class="row">To</div>
        <div class="row">Subject</div>
      </div>
      <div class="doc">
        <div class="tools">
          <span class="style">Body<svg viewBox="0 0 20 20"><path d="M6 8l4 4 4-4"/></svg></span>
          <b>B</b><i>I</i><u>U</u>
          <svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h9M3 15h12"/></svg>
          <svg viewBox="0 0 20 20"><path d="M3 5h14M5.5 10h9M4 15h12"/></svg>
          <svg viewBox="0 0 20 20"><path d="M7.5 5H17M7.5 10H17M7.5 15H17M3.5 5h.01M3.5 10h.01M3.5 15h.01"/></svg>
        </div>
        <div class="ruler"></div>
      </div>
    </div>
  <div class="stage" id="stage">
    <h1 class="draft" id="draft">Typos happen. Oops fixes them right where you typed.</h1>

    <canvas class="glass" id="glass" aria-hidden="true"></canvas>
    <div class="drop" id="drop" aria-hidden="true">
      <div class="orbit"></div>
      <svg class="eyes" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round">
        <defs><clipPath id="lid" clipPathUnits="userSpaceOnUse"><rect id="lidRect" x="-8" y="0" width="48" height="48"/></clipPath></defs>
        <g id="eyePair" clip-path="url(#lid)">
          <line id="eyeL" x1="12.7" y1="12.85" x2="12.7" y2="20.55" stroke-width="3.8"/>
          <line id="eyeR" x1="19.3" y1="13.4" x2="19.3" y2="18.6" stroke-width="3.8"/>
        </g>
      </svg>
      <svg class="glyph" id="glyph" viewBox="0 0 24 24"></svg>
      <span class="label" id="dropLabel"></span>
    </div>
    <div class="voice" id="voice" aria-hidden="true">
      <canvas id="bars"></canvas>
      <svg class="tick" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2"><path d="M11.5 16.35l2.75 2.75 6.25-6.9"/></svg>
    </div>
  </div>

  </div>

  <div class="triggers" id="triggers">
    <button type="button" data-act="fix"><span class="keys"><kbd>⌃</kbd><kbd>⌘</kbd><kbd>W</kbd></span><span class="word">Fix</span></button>
    <button type="button" data-act="dictate"><span class="keys"><kbd>⌃</kbd><kbd>⌘</kbd><kbd>X</kbd></span><span class="word">Dictate</span></button>
    <button type="button" data-act="actions"><span class="keys"><kbd>⌃</kbd><kbd>⌘</kbd><kbd>E</kbd></span><span class="word">Actions</span></button>
      <button type="button" class="again" id="again" aria-label="Start over"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10a5.5 5.5 0 105.5-5.5H5.5M8 2L5.5 4.5 8 7"/></svg></button>
  </div>
</main>

<p class="sr" id="said" role="status"></p>

<footer class="foot">
  <span>Apple silicon</span>
  <span>macOS 26 or later</span>
  <span>Free and open source</span>
</footer>
</div>

<script src="glass.js"></script>
<script src="copy.js"></script>
<script src="drop.js"></script>
<script src="voice.js"></script>
<script src="wheel.js"></script>
<script src="hero.js"></script>
</body>
</html>
